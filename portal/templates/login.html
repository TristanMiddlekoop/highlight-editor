<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HighlightOS — Client Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #ffffff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 400px; padding: 40px; }
        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
        .logo span { color: #ff8c00; }
        .subtitle { color: rgba(255,255,255,0.4); font-size: 0.85rem; margin-bottom: 40px; letter-spacing: 1px; text-transform: uppercase; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 32px; }
        h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
        p { color: rgba(255,255,255,0.4); font-size: 0.85rem; margin-bottom: 24px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 8px; }
        input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 0.95rem; margin-bottom: 20px; outline: none; }
        input:focus { border-color: #ff8c00; }
        button { width: 100%; padding: 14px; background: #ff8c00; color: #000; border: none; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; letter-spacing: 0.5px; }
        button:hover { background: #ffaa33; }
        .error { background: rgba(255,50,50,0.1); border: 1px solid rgba(255,50,50,0.3); color: #ff6b6b; padding: 12px 16px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 20px; }
        .footer { text-align: center; margin-top: 24px; color: rgba(255,255,255,0.2); font-size: 0.75rem; }
        .footer a { color: rgba(255,255,255,0.2); text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">Highlight<span>OS</span></div>
    <div class="subtitle">by TM Ventures</div>
    <div class="card">
        <h2>Client Portal</h2>
        <p>Sign in with the email address registered to your account.</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="coach@yourteam.com" required autofocus>
            <button type="submit">Sign In →</button>
        </form>
    </div>
    <div class="footer">
        <a href="https://tmventures.io">tmventures.io</a>
    </div>
</div>
</body>
</html>
